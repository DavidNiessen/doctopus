name: Performance budgets

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  budgets:
    name: ${{ matrix.scenario }} performance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: [compiler, browser]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Install browser fixture prerequisites
        if: matrix.scenario == 'browser'
        run: |
          npm run demo:build
          npx playwright install chromium
      - name: Enforce recorded budgets
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          if test "$SCENARIO" = compiler; then
            npm run benchmark
          else
            npm run benchmark:browser
          fi
      - name: Retain measured reports and public fixture screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-${{ matrix.scenario }}-${{ github.sha }}
          include-hidden-files: true
          retention-days: 28
          if-no-files-found: error
          path: |
            .doctopus/benchmark-report.json
            .doctopus/browser-benchmark/**/report.json
            .doctopus/browser-benchmark/**/*-mobile.png
