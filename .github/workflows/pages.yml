name: Deploy public demo

on:
  workflow_run:
    workflows: ['Repository quality']
    branches: [master]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download the demo tested by this exact quality run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pages-demo-${{ github.event.workflow_run.head_sha }}
          path: demo
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Prepare Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: demo
          retention-days: 1
  deploy:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested mock demo
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  verify:
    name: Verify hosted mock demo
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PAGES_DEMO_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Check out the tested browser checks
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - name: Verify the HTTPS publication
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const address = new URL(process.env.PAGES_DEMO_URL);
          address.protocol = 'https:';
          appendFileSync(process.env.GITHUB_ENV, `PAGES_DEMO_URL=${address.href}\n`);
          NODE
      - name: Wait for the public site
        run: curl --proto '=https' --fail --retry 12 --retry-all-errors --retry-delay 5 --max-time 10 --output /dev/null "$PAGES_DEMO_URL"
      - name: Exercise the public demo without calling an API server
        run: npm run test:pages
      - name: Retain hosted browser results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-demo-browser-${{ github.event.workflow_run.head_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-pages-report/
            .doctopus/pages-screenshots/
            test-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
