name: Repository quality

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-candidate:
        description: Retain and attest exact candidates from a clean release tag
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  code-security:
    name: Source security
    uses: ./.github/workflows/code-scanning.yml
    permissions:
      contents: read
      security-events: write

  pnpm:
    name: pnpm frozen workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Install pinned pnpm
        run: npm install --global --ignore-scripts "$(node --input-type=module -e 'import p from "./package.json" with {type:"json"}; console.log(p.packageManager)')"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --audit-level=moderate
      - run: pnpm run check
      - name: Verify prepared release lockfile
        run: node scripts/test-pnpm-release.mjs
      - name: Require unchanged dependency metadata
        run: git diff --exit-code -- package.json package-lock.json pnpm-lock.yaml pnpm-workspace.yaml

  source:
    name: Source and browser
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked tooling
        run: npm ci --ignore-scripts
      - name: Require clean release source before building candidates
        if: inputs.release-candidate
        run: node scripts/check-release-source.mjs
      - name: Audit locked dependencies
        run: npm audit --audit-level=moderate
      - name: Set up snippet Java runtime
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Check formatting and lint
        run: npm run check
      - name: Set up first-party Go snippet toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build demo publication
        run: npm run demo:build
      - name: Execute generated snippets in all five languages
        run: npm run test:snippets
      - name: Execute first-party Go plugin snippets
        run: npm run test:go-snippets
      - name: Verify installed npm archive consumers
        id: packages
        run: npm run test:packages
      - name: Validate authored examples offline
        run: node packages/cli/dist/main.js doctor examples/demo --strict
      - name: Check first-party plugin conformance
        run: |
          node packages/cli/dist/main.js plugin-check release-label.mjs examples/plugins --trust-plugins
          node packages/cli/dist/main.js plugin-check brand-theme.mjs examples/plugins --trust-plugins
          node packages/cli/dist/main.js plugin-check deployment.mjs examples/source-plugin --trust-plugins
          node packages/cli/dist/main.js plugin-check go.mjs examples/snippet-plugin --trust-plugins
      - name: Install browser
        run: npx playwright install chromium
      - name: Test reader and API playground
        id: browser
        run: npm run test:e2e
      - name: Retain candidate archives and validation reports
        if: always() && (steps.packages.outcome == 'success' || steps.browser.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-validation-${{ github.sha }}
          path: |
            .doctopus/npm-candidates/**/*.tgz
            .doctopus/npm-candidates/**/manifest.json
            .doctopus/npm-candidates/**/consumer-result.json
            .doctopus/npm-candidates/**/consumer-package-lock.json
            .doctopus/npm-candidates/**/consumer-sbom.cdx.json
            playwright-report/
            test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Check conventional PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: npm run check:pr-title

      - name: Retain only the exact tested npm candidates
        if: inputs.release-candidate
        run: node scripts/stage-release-assets.mjs npm
      - name: Attest candidates in their producing job
        id: attest-npm
        if: inputs.release-candidate
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: .doctopus/release-assets/npm/*
      - name: Retain verified candidates for later review
        if: inputs.release-candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-npm-${{ github.run_id }}-${{ github.run_attempt }}
          path: .doctopus/release-assets/npm/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain the producer attestation bundle
        if: inputs.release-candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-npm-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.attest-npm.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 14

  pages-demo:
    name: Static mock demo
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Build and strictly audit the assembled demo
        run: npm run demo:pages
      - run: npx playwright install chromium
      - run: npm run test:pages
      - name: Retain tested static demo
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-demo-${{ github.sha }}
          overwrite: true
          path: .doctopus/pages-demo/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Retain demo browser results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-demo-browser-${{ github.sha }}
          path: |
            playwright-pages-report/
            .doctopus/pages-screenshots/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  database:
    name: Server integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:1bcc18d81671b02906296aad470ec9778a6b71016ce953092024b680bad007b0
        env:
          POSTGRES_USER: doctopus
          POSTGRES_DB: doctopus
          POSTGRES_PASSWORD: isolated-ci-fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U doctopus"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://doctopus:isolated-ci-fixture@127.0.0.1:5432/doctopus
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run test:integration
      - run: npx playwright install chromium
      - run: npm run test:studio
  java:
    name: Java ${{ matrix.java }} / Boot ${{ matrix.boot }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
        boot: ['3.5.16', '4.1.1']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: npm ci --ignore-scripts
      - name: Require clean release source before building candidates
        if: inputs.release-candidate
        run: node scripts/check-release-source.mjs
      - run: npm run build
      - run: node scripts/prepare-java-fixture.mjs
      - name: Verify installed baseline JAR consumers
        id: installed-java
        env:
          BOOT_VERSION: ${{ matrix.boot }}
        run: npm run test:java-consumers -- --boot "$BOOT_VERSION"
      - name: Clear generated Java test reports
        run: node scripts/check-java-results.mjs --clear
      - name: Verify Java consumers
        working-directory: integrations/java
        env:
          BOOT_VERSION: ${{ matrix.boot }}
        run: ./mvnw --batch-mode --no-transfer-progress --strict-checksums -Dspring-boot.version="$BOOT_VERSION" verify
      - name: Require current manifest and host test results
        run: node scripts/check-java-results.mjs
      - name: Retain installed Java candidate evidence
        if: always() && (steps.installed-java.outcome == 'success' || steps.installed-java.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installed-java-${{ matrix.java }}-boot-${{ matrix.boot }}-${{ github.run_id }}
          path: |
            .doctopus/java-candidates/**/report.json
            .doctopus/java-candidates/**/*.cdx.json
            .doctopus/java-candidates/**/*.jar
            .doctopus/java-candidates/**/*.pom
            .doctopus/java-candidates/**/*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Retain only the exact tested java candidates
        if: inputs.release-candidate && matrix.java == '21' && matrix.boot == '3.5.16'
        run: node scripts/stage-release-assets.mjs java
      - name: Attest candidates in their producing job
        id: attest-java
        if: inputs.release-candidate && matrix.java == '21' && matrix.boot == '3.5.16'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: .doctopus/release-assets/java/*
      - name: Retain verified candidates for later review
        if: inputs.release-candidate && matrix.java == '21' && matrix.boot == '3.5.16'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-java-${{ github.run_id }}-${{ github.run_attempt }}
          path: .doctopus/release-assets/java/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain the producer attestation bundle
        if: inputs.release-candidate && matrix.java == '21' && matrix.boot == '3.5.16'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-java-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.attest-java.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 14

  isolated-builds:
    name: Isolated documentation builds
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine@sha256:1bcc18d81671b02906296aad470ec9778a6b71016ce953092024b680bad007b0
        env:
          POSTGRES_USER: doctopus
          POSTGRES_DB: doctopus
          POSTGRES_PASSWORD: isolated-ci-fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U doctopus"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://doctopus:isolated-ci-fixture@127.0.0.1:5432/doctopus
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Require clean release source before building candidates
        if: inputs.release-candidate
        run: node scripts/check-release-source.mjs
      - run: npm run build
      - name: Build approved worker from this checkout
        run: docker build --target isolated-builder --iidfile /tmp/doctopus-builder.id .
      - name: Verify isolated builds and failure cleanup
        run: |
          mkdir -p .doctopus
          ISOLATED_BUILD_IMAGE="$(cat /tmp/doctopus-builder.id)" node scripts/test-isolated-builds.mjs > .doctopus/isolated-build-evidence.json
      - name: Verify API, PostgreSQL and worker Docker lifecycle
        run: ISOLATED_BUILD_IMAGE="$(cat /tmp/doctopus-builder.id)" npm run test:build-worker --silent > .doctopus/build-worker-evidence.json
      - name: Build shipped server from this checkout
        run: docker build --target server --iidfile /tmp/doctopus-server.id .
      - name: Build recorded schema-1 upgrade baseline
        run: node scripts/build-upgrade-baseline.mjs > .doctopus/upgrade-baseline-evidence.json
      - name: Verify fresh Compose installation, private content and outage recovery
        # Test-only reverse proxy; the fixture verifies this pinned image and its TLS authority.
        run: |
          docker pull caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
          SERVER_BASELINE_IMAGE="$(cat .doctopus/upgrade-baseline.id)" SERVER_TEST_IMAGE="$(cat /tmp/doctopus-server.id)" npm run test:server-container --silent > .doctopus/server-container-evidence.json
      - name: Verify tested image inventory and vulnerabilities
        uses: ./.github/actions/image-security
      - name: Retain local control and artifact receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolated-builds-${{ github.sha }}
          path: |
            .doctopus/isolated-build-evidence.json
            .doctopus/build-worker-evidence.json
            .doctopus/server-container-evidence.json
            .doctopus/upgrade-baseline-evidence.json
            .doctopus/container-inventory-evidence.json
            .doctopus/container-security-evidence.json
            .doctopus/container-security-candidates/**/server.grype.json
            .doctopus/container-security-candidates/**/report.json
            .doctopus/container-security-candidates/**/.incomplete
            .doctopus/container-candidates/**/server.cdx.json
            .doctopus/container-candidates/**/report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Retain only the exact tested container candidates
        if: inputs.release-candidate
        run: node scripts/stage-release-assets.mjs container
      - name: Attest candidates in their producing job
        id: attest-container
        if: inputs.release-candidate
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: .doctopus/release-assets/container/*
      - name: Retain verified candidates for later review
        if: inputs.release-candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-container-${{ github.run_id }}-${{ github.run_attempt }}
          path: .doctopus/release-assets/container/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain the producer attestation bundle
        if: inputs.release-candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-container-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.attest-container.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 14

  quality:
    name: Quality
    if: always()
    needs:
      [pnpm, source, database, java, isolated-builds, pages-demo, code-security]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every validation job to succeed
        env:
          PNPM_RESULT: ${{ needs.pnpm.result }}
          SOURCE_RESULT: ${{ needs.source.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          JAVA_RESULT: ${{ needs.java.result }}
          PAGES_RESULT: ${{ needs.pages-demo.result }}
          ISOLATED_RESULT: ${{ needs.isolated-builds.result }}
          CODE_SECURITY_RESULT: ${{ needs.code-security.result }}
        run: test "$PNPM_RESULT" = success && test "$SOURCE_RESULT" = success && test "$DATABASE_RESULT" = success && test "$JAVA_RESULT" = success && test "$ISOLATED_RESULT" = success && test "$PAGES_RESULT" = success && test "$CODE_SECURITY_RESULT" = success
