name: Release rehearsal

on:
  workflow_dispatch:
    inputs:
      version:
        description: Canonical target SemVer (no tags or publication are created)
        type: string
        required: true
      date:
        description: Reproducible YYYY-MM-DD notes date
        type: string
        required: true
      initial:
        description: First release with no merged release tags
        type: boolean
        default: true
      baseline:
        description: Optional local ancestor ref when initial is false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-rehearsal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  code-security:
    name: Source security
    uses: ./.github/workflows/code-scanning.yml
    permissions:
      contents: read
      security-events: write

  plan:
    name: Validate rehearsal plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      java_matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - name: Require the trusted default branch
        run: test "$GITHUB_REF" = refs/heads/master
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:packages
      - uses: ./.github/actions/prepare-release
        with:
          version: ${{ inputs.version }}
          date: ${{ inputs.date }}
          initial: ${{ inputs.initial }}
          baseline: ${{ inputs.baseline }}
          apply: 'false'
      - name: Reuse the repository's supported Java matrix
        id: matrix
        run: |
          node --input-type=module <<'NODE'
          import { readFile, appendFile } from 'node:fs/promises';
          import { parseSource } from '@davidniessen/doctopus-spec';
          const workflow = parseSource(await readFile('.github/workflows/quality.yml', 'utf8'), 'quality.yml');
          const matrix = workflow.jobs.java.strategy.matrix;
          await appendFile(process.env.GITHUB_OUTPUT, `value=${JSON.stringify(matrix)}\n`);
          NODE

  source:
    name: Prepared source and npm consumers
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - uses: ./.github/actions/prepare-release
        id: prepare
        with:
          version: ${{ inputs.version }}
          date: ${{ inputs.date }}
          initial: ${{ inputs.initial }}
          baseline: ${{ inputs.baseline }}
      - run: npm audit --audit-level=moderate
      - run: npm run check
      - run: npm run demo:build
      - run: npm run test:snippets
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false
      - run: npm run test:go-snippets
      - run: npm run test:packages
      - name: Retain unpublished rehearsal artifacts
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unpublished-rehearsal-${{ github.run_id }}
          path: |
            .doctopus/release/
            .doctopus/npm-candidates/**/*.tgz
            .doctopus/npm-candidates/**/manifest.json
            .doctopus/npm-candidates/**/consumer-result.json
            .doctopus/npm-candidates/**/consumer-package-lock.json
            .doctopus/npm-candidates/**/consumer-sbom.cdx.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  server:
    name: Prepared server integration
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:1bcc18d81671b02906296aad470ec9778a6b71016ce953092024b680bad007b0
        env:
          POSTGRES_USER: doctopus
          POSTGRES_DB: doctopus
          POSTGRES_PASSWORD: isolated-ci-fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U doctopus"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://doctopus:isolated-ci-fixture@127.0.0.1:5432/doctopus
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: ./.github/actions/prepare-release
        with:
          version: ${{ inputs.version }}
          date: ${{ inputs.date }}
          initial: ${{ inputs.initial }}
          baseline: ${{ inputs.baseline }}
      - run: npm run build
      - run: npm run test:integration

  browsers:
    name: Prepared browser compatibility
    needs: plan
    uses: ./.github/workflows/browser-compatibility.yml
    with:
      prepare: true
      version: ${{ inputs.version }}
      date: ${{ inputs.date }}
      initial: ${{ inputs.initial }}
      baseline: ${{ inputs.baseline }}

  java:
    name: Prepared Java ${{ matrix.java }} / Boot ${{ matrix.boot }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.java_matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: npm ci --ignore-scripts
      - uses: ./.github/actions/prepare-release
        with:
          version: ${{ inputs.version }}
          date: ${{ inputs.date }}
          initial: ${{ inputs.initial }}
          baseline: ${{ inputs.baseline }}
      - run: npm run build
      - run: node scripts/prepare-java-fixture.mjs
      - name: Verify installed baseline JAR consumers
        id: installed-java
        env:
          BOOT_VERSION: ${{ matrix.boot }}
        run: npm run test:java-consumers -- --boot "$BOOT_VERSION"
      - run: node scripts/check-java-results.mjs --clear
      - name: Verify prepared Java integrations
        working-directory: integrations/java
        env:
          BOOT_VERSION: ${{ matrix.boot }}
        run: ./mvnw --batch-mode --no-transfer-progress --strict-checksums -Dspring-boot.version="$BOOT_VERSION" verify
      - run: node scripts/check-java-results.mjs
      - name: Retain current Java results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prepared-java-${{ matrix.java }}-boot-${{ matrix.boot }}-${{ github.run_id }}
          path: integrations/java/**/target/surefire-reports/*.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Retain installed Java candidate evidence
        if: always() && (steps.installed-java.outcome == 'success' || steps.installed-java.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installed-java-${{ matrix.java }}-boot-${{ matrix.boot }}-${{ github.run_id }}
          path: |
            .doctopus/java-candidates/**/report.json
            .doctopus/java-candidates/**/*.cdx.json
            .doctopus/java-candidates/**/*.jar
            .doctopus/java-candidates/**/*.pom
            .doctopus/java-candidates/**/*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  isolated-builds:
    name: Prepared isolated builds
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine@sha256:1bcc18d81671b02906296aad470ec9778a6b71016ce953092024b680bad007b0
        env:
          POSTGRES_USER: doctopus
          POSTGRES_DB: doctopus
          POSTGRES_PASSWORD: isolated-ci-fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U doctopus"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://doctopus:isolated-ci-fixture@127.0.0.1:5432/doctopus
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: ./.github/actions/prepare-release
        with:
          version: ${{ inputs.version }}
          date: ${{ inputs.date }}
          initial: ${{ inputs.initial }}
          baseline: ${{ inputs.baseline }}
      - run: npm run build
      - name: Build approved worker from this checkout
        run: docker build --target isolated-builder --iidfile /tmp/doctopus-builder.id .
      - name: Verify isolated builds and failure cleanup
        run: |
          mkdir -p .doctopus
          ISOLATED_BUILD_IMAGE="$(cat /tmp/doctopus-builder.id)" node scripts/test-isolated-builds.mjs > .doctopus/isolated-build-evidence.json
      - name: Verify API, PostgreSQL and worker Docker lifecycle
        run: ISOLATED_BUILD_IMAGE="$(cat /tmp/doctopus-builder.id)" npm run test:build-worker --silent > .doctopus/build-worker-evidence.json
      - name: Build shipped server from this checkout
        run: docker build --target server --iidfile /tmp/doctopus-server.id .
      - name: Build recorded schema-1 upgrade baseline
        run: node scripts/build-upgrade-baseline.mjs > .doctopus/upgrade-baseline-evidence.json
      - name: Verify fresh Compose installation, private content and outage recovery
        run: |
          docker pull caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
          SERVER_BASELINE_IMAGE="$(cat .doctopus/upgrade-baseline.id)" SERVER_TEST_IMAGE="$(cat /tmp/doctopus-server.id)" npm run test:server-container --silent > .doctopus/server-container-evidence.json
      - name: Verify tested image inventory and vulnerabilities
        uses: ./.github/actions/image-security
      - name: Require receipts from the prepared tool and image
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import { toolVersion } from '@davidniessen/doctopus-contracts';
          import { createHash } from 'node:crypto';
          const image = (await readFile('/tmp/doctopus-builder.id', 'utf8')).trim();
          const isolated = JSON.parse(await readFile('.doctopus/isolated-build-evidence.json', 'utf8'));
          const worker = JSON.parse(await readFile('.doctopus/build-worker-evidence.json', 'utf8'));
          assert(isolated.checks >= 6 && isolated.receipts.length >= 2);
          assert(worker.checks.length >= 7 && worker.results.length >= 2);
          for (const receipt of isolated.receipts) {
            assert.equal(receipt.toolVersion, toolVersion);
            assert.equal(receipt.runtime.toolVersion, toolVersion);
            assert.equal(receipt.image, image);
          }
          for (const result of worker.results) {
            assert.equal(result.toolVersion, toolVersion);
            assert.equal(result.resolvedImage, image);
          }
          assert.equal(worker.automaticPublication, false);
          const serverImage = (await readFile('/tmp/doctopus-server.id', 'utf8')).trim();
          const server = JSON.parse(await readFile('.doctopus/server-container-evidence.json', 'utf8'));
          assert.equal(server.toolVersion, toolVersion);
          assert.equal(server.runtime.toolVersion, toolVersion);
          assert.equal(server.runtime.packageManagersAbsent, true);
          assert.equal(server.resolvedImage, serverImage);
          assert.equal(server.cleanupVerified, true);
          assert(server.checks.length >= 9 && server.privateFiles >= 8);
          const { proxyImage } = await import('./scripts/lib/server-proxy-fixture.mjs');
          assert.equal(server.proxy.serverImage, serverImage);
          assert.equal(server.proxy.artifactId, server.artifactId);
          assert.equal(server.proxy.proxyImage, proxyImage);
          assert.equal(server.proxy.cleanupVerified, true);
          assert(server.proxy.checks.length >= 8 && server.proxy.privateFiles >= 8);
          assert.match(server.proxy.resolvedProxyImage, /^sha256:[a-f0-9]{64}$/);
          assert.match(server.proxy.templateSha256, /^[a-f0-9]{64}$/);
          assert.equal(server.proxy.templateSha256, createHash('sha256').update(await readFile('deploy/Caddyfile')).digest('hex'));
          assert.deepEqual(server.proxy.proxyCapabilities, ['NET_BIND_SERVICE']);
          assert.match(server.proxy.tlsVersion, /^TLSv1\.[23]$/);
          assert.match(server.proxy.certificateFingerprint, /^(?:[A-F0-9]{2}:){31}[A-F0-9]{2}$/);
          assert.equal(server.recovery.resolvedImage, serverImage);
          assert.equal(server.recovery.artifactId, server.artifactId);
          assert.equal(server.recovery.cleanupVerified, true);
          assert.equal(server.recovery.composeOverride, true);
          assert(server.recovery.checks.length >= 9);
          assert.equal(server.offline.serverImage, serverImage);
          assert.equal(server.offline.artifactId, server.artifactId);
          assert.equal(server.offline.runtime.artifactId, server.artifactId);
          assert.equal(server.offline.runtime.toolVersion, toolVersion);
          assert.equal(server.offline.runtime.uid, 1000);
          assert.equal(server.offline.runtime.defaultRoute, false);
          assert.equal(server.offline.cleanupVerified, true);
          assert.equal(server.offline.backupWithComposeOverride, true);
          assert.equal(server.recovery.databaseImage, server.offline.databaseImage);
          assert(server.offline.checks.length >= 8 && server.offline.runtime.privateFiles >= 8);
          assert(Number.isSafeInteger(server.offline.archiveBytes) && server.offline.archiveBytes > 0);
          assert.match(server.offline.archiveSha256, /^[a-f0-9]{64}$/);
          assert.match(server.offline.databaseImage, /^sha256:[a-f0-9]{64}$/);
          assert.match(server.offline.databaseReference, /^postgres:17-alpine@sha256:[a-f0-9]{64}$/);
          const baseline = JSON.parse(await readFile('.doctopus/upgrade-baseline-evidence.json', 'utf8'));
          const { upgradeBaselineCommit } = await import('./scripts/lib/server-upgrade-fixture.mjs');
          assert.equal(baseline.baselineCommit, upgradeBaselineCommit);
          assert.equal(server.upgrade.baselineCommit, upgradeBaselineCommit);
          assert.equal(server.upgrade.baselineImage, baseline.image);
          assert.equal(server.upgrade.serverImage, serverImage);
          assert.equal(server.upgrade.artifactId, server.artifactId);
          assert.equal(server.upgrade.schemaBefore, 1);
          assert.equal(server.upgrade.schemaAfter, 2);
          assert.equal(server.upgrade.schemaRestored, 1);
          assert.equal(server.upgrade.cleanupVerified, true);
          assert(server.upgrade.checks.length >= 10 && server.upgrade.privateFiles >= 8);
          assert.match(server.upgrade.metadataSha256, /^[a-f0-9]{64}$/);
          const inventory = JSON.parse(await readFile('.doctopus/container-inventory-evidence.json', 'utf8'));
          assert.equal(inventory.toolVersion, toolVersion);
          assert.equal(inventory.resolvedImage, serverImage);
          assert.equal(inventory.signed, false);
          assert.equal(inventory.publicationApproved, false);
          const security = JSON.parse(await readFile('.doctopus/container-security-evidence.json', 'utf8'));
          assert.equal(security.toolVersion, toolVersion);
          assert.equal(security.resolvedImage, serverImage);
          assert.equal(security.inventorySha256, inventory.inventory.sha256);
          assert.equal(security.assessment.passed, true);
          assert.equal(security.signed, false);
          assert.equal(security.publicationApproved, false);
          NODE
      - name: Retain prepared control and artifact receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prepared-isolated-builds-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .doctopus/isolated-build-evidence.json
            .doctopus/build-worker-evidence.json
            .doctopus/server-container-evidence.json
            .doctopus/upgrade-baseline-evidence.json
            .doctopus/container-inventory-evidence.json
            .doctopus/container-security-evidence.json
            .doctopus/container-security-candidates/**/server.grype.json
            .doctopus/container-security-candidates/**/report.json
            .doctopus/container-security-candidates/**/.incomplete
            .doctopus/container-candidates/**/server.cdx.json
            .doctopus/container-candidates/**/report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  performance:
    name: Prepared ${{ matrix.scenario }} performance
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: [compiler, browser]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: ./.github/actions/prepare-release
        with:
          version: ${{ inputs.version }}
          date: ${{ inputs.date }}
          initial: ${{ inputs.initial }}
          baseline: ${{ inputs.baseline }}
      - run: npm run build
      - name: Prepare the matching browser publication
        if: matrix.scenario == 'browser'
        run: |
          npm run demo:build
          npx playwright install chromium
      - name: Enforce candidate performance budgets
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          if test "$SCENARIO" = compiler; then
            npm run benchmark
          else
            npm run benchmark:browser
          fi
          node scripts/check-prepared-performance.mjs "$SCENARIO"
      - name: Retain prepared measurements and public fixture screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prepared-performance-${{ matrix.scenario }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          retention-days: 28
          if-no-files-found: error
          path: |
            .doctopus/benchmark-report.json
            .doctopus/browser-benchmark/**/report.json
            .doctopus/browser-benchmark/**/*-mobile.png

  result:
    name: Rehearsal result
    if: always()
    needs:
      [
        plan,
        source,
        server,
        browsers,
        java,
        isolated-builds,
        performance,
        code-security,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every rehearsal job to succeed
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SOURCE_RESULT: ${{ needs.source.result }}
          SERVER_RESULT: ${{ needs.server.result }}
          BROWSER_RESULT: ${{ needs.browsers.result }}
          JAVA_RESULT: ${{ needs.java.result }}
          ISOLATED_RESULT: ${{ needs.isolated-builds.result }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
          CODE_SECURITY_RESULT: ${{ needs.code-security.result }}
        run: |
          test "$PLAN_RESULT" = success
          test "$SOURCE_RESULT" = success
          test "$SERVER_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$JAVA_RESULT" = success
          test "$ISOLATED_RESULT" = success
          test "$PERFORMANCE_RESULT" = success
          test "$CODE_SECURITY_RESULT" = success
