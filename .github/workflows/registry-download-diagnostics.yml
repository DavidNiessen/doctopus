name: Read-only registry download diagnostics

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing or attempted package version to inspect without writing
        type: string
        default: '0.2.0-candidate.6'
        required: true
  push:
    branches: ['**']
    paths:
      - scripts/diagnose-registry-downloads.mjs
      - scripts/lib/release-http.mjs
      - .github/workflows/registry-download-diagnostics.yml

permissions:
  contents: read
  packages: read

env:
  NODE_USE_ENV_PROXY: '1'

jobs:
  observe:
    name: Inspect redirects and verify bounded artifact downloads
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Inspect only the configured repository's package endpoints
        env:
          GITHUB_PACKAGES_TOKEN: ${{ github.token }}
          DIAGNOSTIC_VERSION: ${{ inputs.version || '0.2.0-candidate.6' }}
        run: node scripts/diagnose-registry-downloads.mjs
