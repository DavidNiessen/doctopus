name: Verify current publication security
description: Verify signed fresh scan bytes and dependency audit for this publication run and accepted image
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
      with:
        name: publication-preflight-${{ github.run_id }}-${{ github.run_attempt }}
        path: .doctopus/publication-preflight/
    - name: Verify the fresh security producer, subject, source and current assessment
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: node scripts/check-publication-preflight.mjs
