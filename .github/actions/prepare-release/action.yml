name: Prepare release rehearsal metadata
description: Verify a source-bound plan and optionally apply metadata for an unpublished rehearsal.
inputs:
  version:
    description: Canonical target SemVer to rehearse
    required: true
  date:
    description: Reproducible YYYY-MM-DD notes date
    required: true
  initial:
    description: Use an initial-release baseline
    default: 'true'
  baseline:
    description: Optional local ancestor ref when initial is false
    default: ''
  apply:
    description: Apply metadata after a successful read-only rehearsal
    default: 'true'
runs:
  using: composite
  steps:
    - name: Verify the plan and prepare metadata
      shell: bash
      env:
        DOCTOPUS_CANDIDATE_VERSION: ${{ inputs.version }}
        DOCTOPUS_RELEASE_DATE: ${{ inputs.date }}
        DOCTOPUS_INITIAL_RELEASE: ${{ inputs.initial }}
        DOCTOPUS_RELEASE_BASELINE: ${{ inputs.baseline }}
        DOCTOPUS_APPLY_RELEASE: ${{ inputs.apply }}
      run: |
        set -euo pipefail
        for value in "$DOCTOPUS_INITIAL_RELEASE" "$DOCTOPUS_APPLY_RELEASE"; do
          if [[ "$value" != true && "$value" != false ]]; then
            echo '::error::Release boolean inputs must be true or false.'
            exit 1
          fi
        done
        if [[ "$DOCTOPUS_INITIAL_RELEASE" == true && -n "$DOCTOPUS_RELEASE_BASELINE" ]]; then
          echo '::error::Choose an initial release or an explicit baseline.'
          exit 1
        fi
        args=(--version "$DOCTOPUS_CANDIDATE_VERSION" --date "$DOCTOPUS_RELEASE_DATE")
        if [[ "$DOCTOPUS_INITIAL_RELEASE" == true ]]; then
          args+=(--initial)
        elif [[ -n "$DOCTOPUS_RELEASE_BASELINE" ]]; then
          args+=(--since "$DOCTOPUS_RELEASE_BASELINE")
        fi
        mkdir -p .doctopus/release
        node scripts/release-plan.mjs "${args[@]}" > .doctopus/release/plan.json
        node scripts/release-prepare.mjs --plan .doctopus/release/plan.json > .doctopus/release/preview.json
        if [[ "$DOCTOPUS_APPLY_RELEASE" == true ]]; then
          node scripts/release-prepare.mjs --plan .doctopus/release/plan.json --apply > .doctopus/release/applied.json
          npm run check:versions -- --release
        fi
