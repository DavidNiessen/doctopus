openapi: 3.1.0
info: { title: Catalog API, version: v2 }
paths:
  /widgets:
    get:
      operationId: listWidgets
      summary: List widgets
      description: The current version of the widget catalog.
      tags: [Widgets]
      responses:
        '200': { description: Widget list }
        '400': { description: Invalid query }
  /exports:
    get:
      operationId: exportWidgets
      summary: Export widgets with a planned retirement
      description: Future lifecycle dates can be announced before the deprecated flag is set.
      tags: [Widgets]
      x-doctopus-lifecycle:
        deprecatedOn: '2028-01-01'
        sunsetOn: '2028-06-01'
        migrationUrl: /guides/migration/#heading-update-your-client
      responses:
        '200': { description: Widget export }
        '400': { description: Invalid query }
