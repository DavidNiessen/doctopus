apiVersion: apps/v1
kind: Deployment
metadata:
  name: doctopus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: doctopus
  template:
    metadata:
      labels:
        app: doctopus
    spec:
      terminationGracePeriodSeconds: 45
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: docs
          image: doctopus:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: doctopus
                  key: public-url
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: doctopus
                  key: database-url
            - name: ROOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: doctopus
                  key: root-token
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 2Gi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
          volumeMounts:
            - name: artifacts
              mountPath: /data/artifacts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: doctopus-artifacts
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: doctopus
spec:
  selector:
    app: doctopus
  ports:
    - port: 8080
      targetPort: 8080
